spring.application.name=autopay-recovery
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5434}/${DB_NAME:autopay_recovery}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.options=-c TimeZone=UTC

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${PORT:8080}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${DASHBOARD_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}}
security.api-key=${API_KEY:}
security.vapi-webhook-secret=${VAPI_WEBHOOK_SECRET:}

vapi.api-key=${VAPI_API_KEY:}
vapi.base-url=${VAPI_BASE_URL:https://api.vapi.ai}
vapi.assistant-id=${VAPI_ASSISTANT_ID:}
vapi.phone-number-id=${VAPI_PHONE_NUMBER_ID:}
