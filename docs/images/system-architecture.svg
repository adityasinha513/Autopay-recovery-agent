<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">Autopay Recovery Agent system architecture</title>
  <desc id="desc">Customers speak with Vapi. Vapi calls the Spring Boot tool adapter and posts lifecycle events. The dashboard calls the REST controllers. Backend tools and controllers delegate to services, repositories, and PostgreSQL.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#52756b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#5576a8"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b27}.title{font-size:27px;font-weight:700}.subtitle{font-size:14px;fill:#62746f}.label{font-size:15px;font-weight:700}.small{font-size:12px;fill:#60716d}.tiny{font-size:11px;fill:#60716d}.node{fill:#fff;stroke:#dce7e2;stroke-width:1.5}.soft{fill:#f2f7f4;stroke:#dce7e2;stroke-width:1.5}.green{fill:#e6f4ec;stroke:#c6e8d7;stroke-width:1.5}.blue{fill:#edf3fb;stroke:#d4e0f0;stroke-width:1.5}.line{fill:none;stroke:#52756b;stroke-width:2.2;marker-end:url(#arrow)}.back{fill:none;stroke:#5576a8;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#arrowBlue)}
    </style>
  </defs>
  <rect width="1440" height="800" rx="24" fill="#f6f8f7"/>
  <text x="52" y="62" class="title">System architecture</text>
  <text x="52" y="88" class="subtitle">The assistant handles conversation; Spring Boot owns recovery operations and persistence.</text>

  <rect x="54" y="138" width="234" height="118" rx="18" class="node"/>
  <circle cx="88" cy="176" r="16" fill="#e6f4ec"/><path d="M80 176h16M88 168v16" stroke="#24604f" stroke-width="2" stroke-linecap="round"/>
  <text x="116" y="174" class="label">Customer</text><text x="76" y="208" class="small">Voice conversation</text><text x="76" y="230" class="small">Fictional demo records</text>

  <rect x="346" y="138" width="234" height="118" rx="18" class="blue"/>
  <circle cx="380" cy="176" r="16" fill="#dce8f7"/><path d="M373 178c3-6 11-6 14 0m-12-8h10m-5-5v4" fill="none" stroke="#3b5d8c" stroke-width="2" stroke-linecap="round"/>
  <text x="408" y="174" class="label">Vapi voice agent</text><text x="368" y="208" class="small">Model · prompt · voice</text><text x="368" y="230" class="small">API Request tools · endCall</text>

  <rect x="346" y="528" width="234" height="122" rx="18" class="node"/>
  <rect x="368" y="550" width="36" height="32" rx="7" fill="#e6f4ec"/><path d="M375 559h22M375 565h22M375 571h15" stroke="#24604f" stroke-width="2" stroke-linecap="round"/>
  <text x="416" y="570" class="label">PayFlow dashboard</text><text x="368" y="606" class="small">React · TypeScript · Vite</text><text x="368" y="628" class="small">Metrics · customers · calls</text>

  <rect x="630" y="104" width="760" height="610" rx="24" fill="#edf3f0" stroke="#cbdad3" stroke-width="1.5"/>
  <text x="662" y="142" class="label">Spring Boot application · Railway / Java 21</text>
  <text x="662" y="166" class="tiny">Shared API key for app routes · separate shared secret header for the Vapi webhook</text>

  <rect x="680" y="196" width="260" height="90" rx="16" class="node"/>
  <text x="704" y="232" class="label">REST controllers</text><text x="704" y="258" class="small">Customer · payment · dashboard</text><text x="704" y="277" class="small">Outbound call · health</text>
  <rect x="1050" y="196" width="280" height="90" rx="16" class="blue"/>
  <text x="1074" y="232" class="label">Vapi HTTP adapter</text><text x="1074" y="258" class="small">POST /api/tools/vapi/{toolName}</text><text x="1074" y="277" class="small">Validates args · dispatches Java tools</text>

  <rect x="680" y="360" width="260" height="90" rx="16" class="node"/>
  <text x="704" y="396" class="label">Application services</text><text x="704" y="422" class="small">Customer · payment · recovery · call</text><text x="704" y="441" class="small">Mock payment behavior</text>
  <rect x="1050" y="360" width="280" height="90" rx="16" class="green"/>
  <text x="1074" y="396" class="label">Agent tools</text><text x="1074" y="422" class="small">Customer · payment · recovery · support</text><text x="1074" y="441" class="small">Reuse the application services</text>

  <rect x="850" y="520" width="300" height="78" rx="16" class="node"/>
  <text x="874" y="552" class="label">Spring Data JPA repositories</text><text x="874" y="578" class="small">Entity persistence · call reconciliation</text>
  <rect x="850" y="628" width="300" height="56" rx="16" class="soft"/>
  <ellipse cx="884" cy="649" rx="13" ry="5" fill="#d9e9e1" stroke="#52756b"/><path d="M871 649v17c0 3 6 6 13 6s13-3 13-6v-17m-26 8c0 3 6 6 13 6s13-3 13-6" fill="#e6f4ec" stroke="#52756b" stroke-width="1.3"/>
  <text x="914" y="654" class="label">PostgreSQL · Supabase</text><text x="914" y="675" class="tiny">customers · calls · recovery_actions</text>

  <path d="M288 197H338" class="line"/><text x="294" y="183" class="tiny">calls</text>
  <path d="M570 184H1018V220H1042" class="line"/>
  <path d="M462 256V302H660V244H672" class="line"/><text x="474" y="320" class="tiny">lifecycle webhook</text>
  <path d="M680 220H588" class="back"/><text x="603" y="206" class="tiny">outbound call</text>
  <path d="M580 568H600V320H700V294" class="line"/><text x="586" y="553" class="tiny">dashboard REST</text>

  <path d="M810 286V352" class="line"/>
  <path d="M1190 286V352" class="line"/>
  <path d="M1050 405H948" class="line"/>
  <path d="M810 450V486H1000V512" class="line"/>
  <path d="M1000 598V620" class="line"/>

  <text x="662" y="700" class="tiny">Outbound calls use VapiService. Webhook handles supported lifecycle events; unmatched calls have no default customer fallback.</text>
</svg>
